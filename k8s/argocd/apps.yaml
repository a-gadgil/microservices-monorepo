apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quick-commerce-api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/thinksapient/microservices-monorepo.git
    targetRevision: main
    path: k8s/quick-commerce
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
