apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: baremetal24/quick-commerce-inventory-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
  - port: 8002
    targetPort: 8002